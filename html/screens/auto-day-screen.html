<div id="auto-day-screen" class="screen flex flex-col min-h-0 gap-4 p-4 sm:p-6">
    <div class="relative bg-mafia-coal border border-mafia-border rounded-lg p-3 sm:p-4 flex-shrink-0 min-w-0">
        <button type="button" data-goto="menu-screen" class="absolute left-3 top-3 sm:left-4 sm:top-4 z-10 text-mafia-gold/80 hover:text-mafia-gold text-sm sm:text-base uppercase tracking-wider cursor-pointer text-left leading-none">← Меню</button>
        <span class="absolute right-3 top-3 sm:right-4 sm:top-4 z-10 font-display text-mafia-gold/80 text-sm sm:text-base tracking-widest"><span id="auto-day-label">День 1</span></span>
        <div class="flex justify-center w-full min-w-0 pt-11 sm:pt-14">
            <div class="timer-control-frame inline-flex flex-row flex-nowrap items-center justify-center gap-3 sm:gap-4 max-w-full min-w-0 overflow-x-auto rounded-lg border border-mafia-border/60 bg-mafia-black/25 px-3 py-2 sm:px-5 sm:py-3">
                <div id="auto-day-timer-pill" class="timer-pill player-slot__foul-pill flex shrink-0 items-center justify-center rounded border border-mafia-border/35 bg-black/25 px-2 py-1 transition-[background-color,border-color] duration-[118ms] ease-out">
                    <div id="auto-day-timer" class="font-sans font-semibold tabular-nums leading-none text-mafia-cream/95 transition-colors duration-[88ms] ease-out">60</div>
                </div>
                <div class="flex gap-2 sm:gap-3 items-center shrink-0">
                    <button type="button" id="auto-day-start-btn" data-action="auto-day-toggle-timer" aria-pressed="false" class="px-3 py-2 sm:px-5 sm:py-3 bg-green-800 hover:bg-green-700 border border-green-600 text-white font-semibold rounded uppercase text-xs sm:text-sm tracking-wider cursor-pointer transition-[background-color,border-color,box-shadow,transform,color] duration-[118ms] ease-out">Старт</button>
                    <button type="button" data-action="auto-day-reset-timer" data-seconds="60" class="px-2.5 py-1.5 sm:px-4 sm:py-2.5 bg-mafia-card hover:bg-mafia-border border border-mafia-border text-mafia-cream rounded text-xs sm:text-sm cursor-pointer">60 с</button>
                    <button type="button" data-action="auto-day-reset-timer" data-seconds="30" class="px-2.5 py-1.5 sm:px-4 sm:py-2.5 bg-mafia-card hover:bg-mafia-border border border-mafia-border text-mafia-cream rounded text-xs sm:text-sm cursor-pointer">30 с</button>
                    <button type="button" id="auto-day-switch-host" data-action="auto-switch-host-open" class="hidden ml-1 w-9 h-9 sm:w-10 sm:h-10 flex items-center justify-center rounded border border-mafia-gold/55 bg-mafia-blood/20 hover:bg-mafia-blood/40 text-mafia-gold cursor-pointer transition-colors" title="Передать обычному ведущему" aria-label="Передать обычному ведущему">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="m3 11 18-5v12L3 14v-3z"/>
                            <path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="flex-1 min-h-0 flex flex-col overflow-hidden">
        <div id="auto-day-players-list" class="grid grid-flow-col grid-cols-2 grid-rows-5 gap-2 flex-1 min-h-0 min-w-0 overflow-hidden"></div>
    </div>
    <div class="bg-mafia-coal border border-mafia-border rounded-lg p-4 sm:p-5 flex-shrink-0">
        <div id="auto-day-nominees" class="voting-order-queue text-mafia-cream/80 min-h-[1.5rem] mb-3 font-mono tabular-nums">—</div>
        <div class="flex flex-col gap-2">
            <button type="button" id="auto-day-go-vote" data-action="auto-day-go-vote" class="w-full py-2.5 bg-mafia-blood hover:bg-mafia-bloodLight border-2 border-mafia-gold text-mafia-gold font-semibold rounded text-sm uppercase tracking-wider cursor-pointer transition-all active:scale-[0.98]">Голосование</button>
            <button type="button" data-action="auto-day-skip-vote" class="w-full py-2.5 bg-mafia-card hover:bg-mafia-border border border-mafia-border text-mafia-cream/85 font-medium rounded text-sm uppercase tracking-wider cursor-pointer transition-colors">Без голосования → ночь</button>
        </div>
    </div>
</div>
