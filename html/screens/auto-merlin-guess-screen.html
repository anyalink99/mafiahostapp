<div id="auto-merlin-guess-screen" class="screen flex flex-col p-4 sm:p-6 overflow-auto">

        <span class="text-mafia-cream/60 text-sm sm:text-base uppercase tracking-wider">Попытка чёрных</span>
        <span class="font-display text-mafia-gold/80 text-sm sm:text-base tracking-widest">Мерлин</span>
    </div>
    <div class="max-w-md w-full mx-auto mt-6 space-y-5 flex-shrink-0 pb-8">

            <div id="auto-merlin-guess-grid" class="auto-target-grid"></div>
        </div>
        <button type="button" data-action="auto-merlin-guess-skip" class="w-full py-2 text-mafia-cream/55 hover:text-mafia-cream/85 text-sm uppercase tracking-wider cursor-pointer">Пропустить — оставить красных</button>
    </div>
