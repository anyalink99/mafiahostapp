<div id="role-screen" class="screen fixed inset-0 z-50 flex flex-col items-center justify-center p-6 cursor-pointer h-[100dvh]" data-close="role">
    <div id="role-bg" class="absolute inset-0 transition-colors duration-500"></div>
    <div class="relative z-10 flex flex-col items-center justify-center text-center">
        <div id="role-icon-wrap" class="role-icon role-icon--large mb-4 text-mafia-gold/95 flex-shrink-0" aria-hidden="true"></div>
        <p id="role-label" class="font-display text-mafia-gold/90 text-xl sm:text-2xl tracking-[0.3em] uppercase mb-3">Твоя роль</p>
        <h1 id="role-name" class="font-display font-bold text-5xl sm:text-7xl md:text-8xl tracking-wider"></h1>
        <p id="close-hint" class="mt-14 text-white/60 text-base tracking-widest uppercase" style="display: none;">Нажми в любое место — продолжить</p>
    </div>
</div>
