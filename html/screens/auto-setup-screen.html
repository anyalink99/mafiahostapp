<div id="auto-setup-screen" class="screen flex flex-col p-4 sm:p-6 overflow-auto">
    <div class="flex items-center justify-between flex-shrink-0 py-2">
        <button type="button" data-goto="prepare-mode-screen" class="text-mafia-gold/80 hover:text-mafia-gold text-sm sm:text-base uppercase tracking-wider cursor-pointer">← Назад</button>
        <span class="font-display text-mafia-gold/80 text-sm sm:text-base tracking-widest">Автономный ведущий</span>
    </div>
    <div class="max-w-md w-full mx-auto mt-4 space-y-5 flex-shrink-0 pb-8">
        <div id="auto-resume-block" class="hidden bg-mafia-coal border border-mafia-gold/40 rounded-lg p-4 space-y-3">
            <p class="text-mafia-cream/90 text-sm">У вас есть незавершённая партия — <span id="auto-resume-phase" class="text-mafia-gold"></span>.</p>
            <button type="button" data-action="auto-resume" class="w-full py-3 bg-mafia-blood hover:bg-mafia-bloodLight border-2 border-mafia-gold text-mafia-gold font-semibold uppercase tracking-wider rounded cursor-pointer">Продолжить</button>
            <button type="button" data-action="auto-restart" class="w-full py-2 text-mafia-cream/60 hover:text-mafia-cream text-sm uppercase tracking-wider cursor-pointer">Начать заново</button>
        </div>
        <div id="auto-fresh-block" class="space-y-5">
            <section class="bg-mafia-coal border border-mafia-border rounded-lg p-4 sm:p-5">
                <h2 class="font-display text-mafia-gold text-lg tracking-widest mb-3">Готов к раздаче</h2>
                <p id="auto-fresh-summary" class="text-mafia-cream/85 text-sm mb-2"></p>
                <p class="text-mafia-cream/65 text-xs">Удержание 5 секунд в любом месте экрана (или Backspace) — возврат к предыдущему шагу.</p>
            </section>
            <button type="button" data-action="auto-begin" class="w-full py-3 bg-mafia-blood hover:bg-mafia-bloodLight border-2 border-mafia-gold text-mafia-gold font-semibold text-base uppercase tracking-wider rounded cursor-pointer transition-all active:scale-[0.98]">Раздать роли</button>
        </div>
    </div>
</div>
