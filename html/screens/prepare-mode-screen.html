<div id="prepare-mode-screen" class="screen flex flex-col p-4 sm:p-6 overflow-auto">
    <div class="flex items-center justify-between flex-shrink-0 py-2">
        <button type="button" data-goto="menu-screen" class="text-mafia-gold/80 hover:text-mafia-gold text-sm sm:text-base uppercase tracking-wider cursor-pointer">← Меню</button>
        <span class="font-display text-mafia-gold/80 text-sm sm:text-base tracking-widest">Подготовка</span>
    </div>
    <div class="max-w-md w-full mx-auto mt-6 space-y-5 flex-shrink-0 pb-8">
        <section class="bg-mafia-coal border border-mafia-border rounded-lg p-4 sm:p-5">
            <h2 class="font-display text-mafia-gold text-lg tracking-widest mb-3">Режим</h2>
            <div id="prepare-mode-options" class="grid grid-cols-2 gap-2"></div>
        </section>
        <section id="prepare-variant-section" class="bg-mafia-coal border border-mafia-border rounded-lg p-4 sm:p-5 hidden">
            <h2 class="font-display text-mafia-gold text-lg tracking-widest mb-3">Режим игры</h2>
            <div id="prepare-variant-options" class="grid grid-cols-2 gap-2"></div>
            <p id="prepare-variant-hint" class="text-mafia-cream/65 text-xs mt-3"></p>
        </section>
        <button type="button" data-action="prepare-continue" class="w-full py-3 bg-mafia-blood hover:bg-mafia-bloodLight border-2 border-mafia-gold text-mafia-gold font-semibold text-base uppercase tracking-wider rounded cursor-pointer transition-all active:scale-[0.98]">Продолжить</button>
    </div>
</div>
