<div id="game-screen" class="screen flex flex-col min-h-0 gap-4 p-4 sm:p-6">
    <div id="timer-panel-wrap" class="mh-content-cap flex-shrink-0">
    <div class="relative bg-mafia-coal border border-mafia-border rounded-lg p-3 sm:p-4 min-w-0">
        <nav class="screen-nav-vert absolute left-3 top-3 bottom-3 sm:left-4 sm:top-4 sm:bottom-4 z-10" aria-label="Экраны">
            <button type="button" data-action="prepare-enter" class="screen-nav-vert__btn">Подготовка</button>
            <button type="button" data-goto="game-screen" class="screen-nav-vert__btn">Игровой стол</button>
            <button type="button" data-goto="summary-screen" class="screen-nav-vert__btn">Итоги</button>
            <button type="button" data-goto="settings-screen" class="screen-nav-vert__btn">Настройки</button>
            <button type="button" data-goto="menu-screen" class="screen-nav-vert__btn">Меню</button>
        </nav>
        <button type="button" data-goto="menu-screen" class="absolute left-3 top-3 sm:left-4 sm:top-4 z-10 text-mafia-gold/80 hover:text-mafia-gold text-sm sm:text-base uppercase tracking-wider cursor-pointer text-left leading-none">← Меню</button>
        <button type="button" id="btn-host-tools" data-action="host-tools-open" aria-label="Инструменты ведущего" class="absolute right-[6.5rem] top-2.5 sm:right-[7.5rem] sm:top-3 z-10 w-10 h-10 sm:w-11 sm:h-11 flex items-center justify-center rounded-lg border-2 bg-mafia-card border-mafia-border text-mafia-cream hover:border-mafia-gold/50 transition-colors cursor-pointer" title="Инструменты ведущего">
            <svg class="w-5 h-5 sm:w-6 sm:h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
            </svg>
        </button>
        <button type="button" id="btn-timer-voice" data-action="timer-voice-modal-open" aria-label="Озвучка / Ночные действия" aria-pressed="false" class="absolute right-14 top-2.5 sm:right-[4.1rem] sm:top-3 z-10 w-10 h-10 sm:w-11 sm:h-11 flex items-center justify-center rounded-lg border-2 bg-mafia-card border-mafia-border text-mafia-cream hover:border-mafia-gold/50 transition-colors cursor-pointer" title="Озвучка / Ночные действия">
            <svg class="w-5 h-5 sm:w-6 sm:h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M10.34 15.84c-.688-.06-1.386-.09-2.09-.09H7.5a4.5 4.5 0 1 1 0-9h.75c.704 0 1.402-.03 2.09-.09m0 9.18c.253.962.584 1.892.985 2.783.247.55.06 1.21-.463 1.511l-.657.38c-.551.318-1.26.117-1.527-.461a20.845 20.845 0 0 1-1.44-4.282m3.102.069a18.03 18.03 0 0 1-.59-4.59c0-1.586.205-3.124.59-4.59m0 9.18a23.848 23.848 0 0 1 8.835 2.535M10.34 6.66a23.847 23.847 0 0 0 8.835-2.535m0 0A23.74 23.74 0 0 0 18.795 3m.38 1.125a23.91 23.91 0 0 1 1.014 5.395m-1.014 8.855c-.118.38-.245.754-.38 1.125m.38-1.125a23.91 23.91 0 0 0 1.014-5.395m0-3.46c.495.413.811 1.035.811 1.73 0 .695-.316 1.317-.811 1.73m0-3.46a24.347 24.347 0 0 1 0 3.46"/>
            </svg>
        </button>
        <button type="button" id="btn-music" data-action="toggle-music" aria-label="Музыка" aria-pressed="false" class="absolute right-2.5 top-2.5 sm:right-3 sm:top-3 z-10 w-10 h-10 sm:w-11 sm:h-11 flex items-center justify-center rounded-lg border-2 bg-mafia-card border-mafia-border text-mafia-cream hover:border-mafia-gold/50 transition-colors cursor-pointer" title="Музыка">
            <svg class="w-5 h-5 sm:w-6 sm:h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </button>
        <div class="flex justify-center w-full min-w-0 pt-11 sm:pt-14">
            <div class="timer-control-frame inline-flex flex-row flex-nowrap items-center justify-center gap-3 sm:gap-4 max-w-full min-w-0 overflow-x-auto rounded-lg border border-mafia-border/60 bg-mafia-black/25 px-3 py-2 sm:px-5 sm:py-3">
                <div id="timer-pill" class="timer-pill player-slot__foul-pill flex shrink-0 items-center justify-center rounded border border-mafia-border/35 bg-black/25 px-2 py-1 transition-[background-color,border-color] duration-[118ms] ease-out">
                    <div id="timer" class="font-sans font-semibold tabular-nums leading-none text-mafia-cream/95 transition-colors duration-[88ms] ease-out">60</div>
                </div>
                <div class="flex gap-2 sm:gap-3 items-center shrink-0">
                    <button type="button" id="start-btn" data-action="toggle-timer" aria-pressed="false" class="px-3 py-2 sm:px-5 sm:py-3 bg-green-800 hover:bg-green-700 border border-green-600 text-white font-semibold rounded uppercase text-xs sm:text-sm tracking-wider cursor-pointer transition-[background-color,border-color,box-shadow,transform,color] duration-[118ms] ease-out">Старт</button>
                    <button type="button" id="btn-timer-preset-main" data-action="reset-timer" data-seconds="60" class="px-2.5 py-1.5 sm:px-4 sm:py-2.5 bg-mafia-card hover:bg-mafia-border border border-mafia-border text-mafia-cream rounded text-xs sm:text-sm cursor-pointer">60 с</button>
                    <button type="button" id="btn-timer-preset-short" data-action="reset-timer" data-seconds="30" class="px-2.5 py-1.5 sm:px-4 sm:py-2.5 bg-mafia-card hover:bg-mafia-border border border-mafia-border text-mafia-cream rounded text-xs sm:text-sm cursor-pointer">30 с</button>
                </div>
            </div>
        </div>
    </div>
    </div>

    <div class="mh-content-cap flex-1 min-h-0 flex flex-col lg:flex-row gap-3 lg:gap-4 overflow-hidden">
        <aside id="game-side-left" class="hidden lg:flex lg:flex-col lg:w-[18rem] xl:w-[20rem] min-h-0 gap-3 overflow-hidden">
            <div class="bg-mafia-coal border border-mafia-border rounded-lg flex-shrink-0 flex items-center gap-2 px-3 py-2">
                <span class="font-display text-mafia-gold text-sm tracking-widest flex-1 truncate">Игроки</span>
                <button type="button" id="game-side-roles-toggle" data-action="game-side-toggle-roles" aria-pressed="false" class="px-2.5 py-1 rounded border border-mafia-border bg-mafia-card hover:border-mafia-gold/45 text-mafia-cream/85 text-[11px] uppercase tracking-wider cursor-pointer transition-colors">Показать роли</button>
            </div>
            <div class="bg-mafia-coal border border-mafia-border rounded-lg p-2 flex-1 min-h-0 overflow-hidden">
                <div id="game-side-roles-grid" class="h-full min-h-0"></div>
            </div>
        </aside>

        <div class="flex-1 min-w-0 min-h-0 flex flex-col gap-4 overflow-hidden">
            <div class="flex-1 min-h-0 flex flex-col overflow-hidden">
                <div id="players-list" class="grid grid-flow-col grid-cols-2 grid-rows-5 gap-2 flex-1 min-h-0 min-w-0 overflow-hidden"></div>
            </div>
            <div id="game-bottom-controls" class="bg-mafia-coal border border-mafia-border rounded-lg p-4 sm:p-5 flex-shrink-0">
                <div id="voting-order" class="voting-order-queue text-mafia-cream/80 min-h-[1.5rem] mb-3 font-mono tabular-nums">—</div>
                <div class="flex flex-col gap-2">
                    <button type="button" id="btn-go-voting" data-action="go-voting" disabled class="w-full py-2.5 bg-mafia-blood/50 border border-mafia-gold/40 text-mafia-gold/50 font-semibold rounded text-sm uppercase tracking-wider cursor-not-allowed transition-all">Голосование</button>
                </div>
            </div>
        </div>

        <aside class="k-slot player-detail-slot unified-player-slot lg:flex hidden lg:flex-col min-h-0 overflow-hidden relative"></aside>

        <aside id="game-vote-slot" class="hidden min-h-0 gap-3 overflow-hidden">
            <div class="flex items-center justify-between flex-shrink-0">
                <button type="button" data-goto="game-screen" class="text-mafia-gold/80 hover:text-mafia-gold text-sm uppercase tracking-wider cursor-pointer">← Стол</button>
                <span class="font-display text-mafia-gold/80 text-sm tracking-widest">Голосование</span>
            </div>
        </aside>

        <aside id="vote-count-slot" class="k-slot player-detail-slot lg:flex hidden lg:flex-col min-h-0 overflow-hidden relative"></aside>

        <aside id="game-side-right" class="hidden lg:flex lg:flex-col lg:w-[20rem] xl:w-[22rem] min-h-0 gap-3 overflow-hidden">
            <div class="bg-mafia-coal border border-mafia-border rounded-lg flex-shrink-0 px-3 py-2">
                <span class="font-display text-mafia-gold text-sm tracking-widest">Ход игры</span>
            </div>
            <div class="bg-mafia-coal border border-mafia-border rounded-lg p-3 flex-1 min-h-0 overflow-y-auto">
                <ul id="game-side-history" class="text-sm text-mafia-cream/85 space-y-1.5 list-disc pl-5 marker:text-mafia-gold/60"></ul>
                <p id="game-side-history-empty" class="text-sm text-mafia-cream/50">Пока пусто: голосования и выбывания появятся здесь.</p>
            </div>
            <div id="game-side-notes-wrap" class="bg-mafia-coal border border-mafia-border rounded-lg flex-shrink-0">
                <button type="button" id="game-side-notes-toggle" data-action="game-side-toggle-notes" aria-expanded="true" class="w-full flex items-center justify-between gap-2 px-3 py-2 text-left cursor-pointer">
                    <span class="font-display text-mafia-gold text-sm tracking-widest">Примечания</span>
                    <span id="game-side-notes-chevron" class="text-mafia-gold/80 text-xs leading-none transition-transform">▾</span>
                </button>
                <div id="game-side-notes-body" class="px-3 pb-3">
                    <textarea id="game-side-notes" rows="5" placeholder="Заметки ведущего…" class="w-full resize-y rounded border border-mafia-border bg-mafia-card px-2.5 py-2 text-sm text-mafia-cream/90 outline-none transition-colors placeholder:text-mafia-cream/35 focus:border-mafia-gold/45"></textarea>
                </div>
            </div>
        </aside>
    </div>
</div>
