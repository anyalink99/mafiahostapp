<div id="modal-summary-log" class="modal-overlay fixed inset-0 z-[60] hidden flex items-center justify-center p-4 bg-black/70" aria-hidden="true" role="dialog" aria-labelledby="modal-summary-log-title">
    <div class="absolute inset-0" data-action="summary-modal-log-cancel" aria-hidden="true"></div>
    <div class="modal-panel relative z-10 bg-mafia-coal border-2 border-mafia-gold/40 rounded-lg px-5 pt-6 pb-4 max-w-lg w-full shadow-xl max-h-[90dvh] overflow-y-auto">
        <h2 id="modal-summary-log-title" class="font-display text-mafia-gold text-xl text-center font-bold tracking-wide leading-tight mb-4">Запись в логе</h2>
        <label class="sr-only" for="modal-summary-log-text">Текст записи</label>
        <textarea id="modal-summary-log-text" rows="6" class="w-full resize-y rounded border border-mafia-border bg-mafia-card px-3 py-2 text-sm text-mafia-cream/90 focus:border-mafia-gold/45 focus:outline-none"></textarea>
        <div class="mt-5 flex flex-col gap-2">
            <button type="button" data-action="summary-modal-log-save" class="w-full py-3 rounded border-2 border-mafia-gold/60 bg-mafia-blood/30 hover:bg-mafia-blood/45 text-mafia-gold font-semibold text-sm uppercase tracking-wider cursor-pointer transition-colors">Сохранить</button>
            <button type="button" data-action="summary-modal-log-cancel" class="w-full py-2 text-mafia-cream/50 hover:text-mafia-cream/80 text-sm uppercase tracking-wider cursor-pointer">Отмена</button>
        </div>
    </div>
</div>
